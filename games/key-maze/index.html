<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b3147">
  <title>Key Maze</title>
  <link rel="stylesheet" href="./key-maze.css">
</head>
<body>
  <main id="game">
    <header class="topbar">
      <div class="level-badge" aria-label="Level">Lv <span id="level-num">1</span></div>
      <div id="carry-slot" class="carry-slot" aria-label="Carried key"></div>
      <button id="undo-btn" class="icon-btn" aria-label="Undo" type="button">↶</button>
      <button id="settings-btn" class="icon-btn" aria-label="Levels" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
        </svg>
      </button>
      <button id="reset-btn" class="icon-btn" aria-label="Restart level" type="button">↻</button>
    </header>

    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>

    <div class="controls" aria-label="Movement controls">
      <button class="dir-btn dir-up"    data-dir="up"    type="button" aria-label="Up">↑</button>
      <button class="dir-btn dir-left"  data-dir="left"  type="button" aria-label="Left">←</button>
      <button class="dir-btn dir-down"  data-dir="down"  type="button" aria-label="Down">↓</button>
      <button class="dir-btn dir-right" data-dir="right" type="button" aria-label="Right">→</button>
    </div>
  </main>

  <div id="settings-screen" class="settings-screen" hidden>
    <div class="settings-card">
      <div class="settings-title">Level</div>
      <div class="settings-value"><span id="level-value">1</span></div>
      <input id="level-slider" type="range" min="1" max="1" step="1" value="1" aria-label="Level">
      <button id="settings-apply" class="next-btn" type="button">Go</button>
    </div>
  </div>

  <div id="win-screen" class="win-screen" hidden>
    <div class="win-card">
      <div class="win-emoji">⭐</div>
      <div class="win-text">You did it!</div>
      <button id="next-btn" class="next-btn" type="button">Next</button>
    </div>
  </div>

  <script type="module" src="./key-maze.js"></script>
</body>
</html>
